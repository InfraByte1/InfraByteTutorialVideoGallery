<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <!--
      Content-Security-Policy: the main real defense against XSS - even if
      an attacker manages to inject a script, the browser refuses to run
      anything not explicitly allowed here. Notes:
      - script-src has no 'unsafe-inline' because INLINE_RUNTIME_CHUNK=false
        (see .env) keeps CRA's runtime chunk in an external file instead of
        inlining it into this page.
      - style-src still needs 'unsafe-inline' because several UI libraries
        (react-toastify, react-bootstrap) inject <style> tags at runtime;
        CSS can't execute script directly, so this is a much smaller
        concession than allowing inline script would be.
      - img-src/media-src allow any https: host since video/thumbnail URLs
        come from Azure Blob Storage accounts that differ per environment.
      - frame-ancestors is deliberately NOT here: browsers only honor that
        directive from a real HTTP response header, not a <meta> tag, so
        clickjacking protection (frame-ancestors / X-Frame-Options) needs
        to be configured at the hosting/server level instead.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: blob: https:;
        media-src 'self' blob: https:;
        connect-src 'self' https://api.infrabyte.com.au https://api.staging.infrabyte.com.au https://security.infrabyte.com.au https://security.staging.infrabyte.com.au;
        object-src 'none';
        base-uri 'self';
        form-action 'self';"
    />
    <link rel="icon" href="Screenshot_1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0c1a" />
    <meta name="description" content="InfraByte Videos" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/Screenshot_1.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Infrabyte | Videos</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
